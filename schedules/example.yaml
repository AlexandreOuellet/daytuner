# A channel file. Read by @daytuner/schedule (packages/schedule), which a test runs on this very file.
channel: the-funny-bone          # matches the channel in Tunarr
timezone: America/Toronto        # the schedule's own clock, with its daylight-saving rules
grid: 15m                        # slots start and end on a multiple of this, exactly (so do blocks, except next to a head or tail)
ads:                             # each position names its own filler list in Tunarr
  step: 15s                      # planned lengths are multiples of this
  ratio: { min: 15%, max: 60% }  # ads as a share of the show, inside its block (bumpers not counted)
  mid:  { list: Old Ads, every: 8m, length: 2m-3m, tailBuffer: 1m }   # `every` is used when a program has no chapters
  post: { list: Old Ads, length: 0-5m }
  tail: { list: Old Ads, length: 0-25m }
  head: { length: 0 }
  pre:  { length: 0 }
bumpers:                         # no mid: mid breaks are ads only
  head: { list: Station Idents }
  pre:  { list: Station Idents }   # nearest the program
  post: { list: Station Idents }   # nearest the program
  tail: { list: Station Idents }
interstitial: { list: Fillers }  # optional: clips (music videos, PSAs...) that fill a gap nothing
                                 # else fills; what they cannot fill is dead air

overflow: 0                      # as in Tunarr; 0 keeps the grid exact. Per slot override allowed.
lateness: 0                      # as in Tunarr; 0 keeps the grid exact. Per slot override allowed.

pools:
  office-hours:
    shows: [The Office, Parks and Recreation, 30 Rock]
    order: sequential            # never skips an episode; each slot has its own cursor
  comedy-movies-up-to-117:
    movies: { genre: Comedy, duration: "<=117m" }
  kids-movies:
    movies: { genre: Family, duration: "<=117m" }
    order: shuffle               # a bag: each movie once before any repeats

exceptions:                      # special events; they win over the week for the time they cover
  - on: "10-31"                  # every 31 October; use a full date ("2026-10-31") for one year only
    at: "20:00"
    play: { show: Doctor Who, title: "Halloween Special" }   # an explicit pick: off-cursor,
                                                             # the Doctor Who order is untouched
  - on: "12-24"
    at: "15:00"
    play: { movie: The Nightmare Before Christmas }
    counts: kids-movies          # counts against this shuffled pool (the default when the movie is in it)

week:                            # day 0 is Sunday
  sun:
    - { at: "00:00", pool: office-hours }   # add `link: office, linkMode: continue|rerun`: continue shares one head; rerun replays the episodes behind it
    - { at: "13:00", pool: comedy-movies-up-to-117 }
